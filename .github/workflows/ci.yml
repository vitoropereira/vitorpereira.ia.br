name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # velite gera .velite/ — typecheck e testes importam daí
      - run: pnpm exec velite build
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
