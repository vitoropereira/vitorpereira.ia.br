name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # velite gera .velite/ — typecheck e testes importam daí
      - run: npx velite build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
